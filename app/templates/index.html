<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            margin: 50px auto;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }
        button {
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🏠 House Price Prediction</h2>

        <form action="/predict" method="post">
            <input type="text" name="income" placeholder="Avg Area Income" required><br>
            <input type="text" name="age" placeholder="Avg Area House Age" required><br>
            <input type="text" name="rooms" placeholder="Avg Area Number of Rooms" required><br>
            <input type="text" name="bedrooms" placeholder="Avg Area Number of Bedrooms" required><br>
            <input type="text" name="population" placeholder="Area Population" required><br>

            <button type="submit">Predict Price</button>
        </form>
    </div>
</body>
</html>
